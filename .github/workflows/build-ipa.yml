name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Fetch voice frameworks
        run: bash App/Tools/fetch_kokoro.sh

      - name: Run ReaderCore tests
        run: swift test --package-path Packages/ReaderCore

      - name: Generate Xcode project
        run: (cd App && xcodegen generate)

      - name: Build app (unsigned)
        run: |
          xcodebuild -project App/Chaiyue.xcodeproj -scheme Chaiyue \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Chaiyue-unsigned.ipa Payload
          ls -la Chaiyue-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Chaiyue-unsigned-ipa
          path: Chaiyue-unsigned.ipa
          if-no-files-found: error
